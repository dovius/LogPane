<!doctype html>
<html lang="en" class="lv-active">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- No network access at all: logs never leave this page. No inline script either (the standalone build
         replaces 'self' with hashes of what it inlines). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>LogPane</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body class="lv-standalone">
    <div id="lv-root"></div>
    <script src="viewer.js"></script>
  </body>
</html>
